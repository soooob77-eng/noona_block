<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Yellow Stack</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;

    touch-action: none;

    user-select: none;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}

canvas {

    display: block;

    width: 100vw;
    height: 100vh;
}


/* ================================
   점수
================================ */

#ui {

    position: fixed;

    top: 22px;
    left: 0;

    width: 100%;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}

#score {

    color: #FFD21F;

    font-size: 48px;

    font-weight: 900;

    line-height: 1;

    text-shadow:
        2px 2px 0 #111;
}

#message {

    margin-top: 8px;

    color: #FFD21F;

    font-size: 15px;

    font-weight: bold;

    text-shadow:
        1px 1px 0 #111;
}


/* ================================
   게임 오버
================================ */

#gameOver {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        rgba(255,255,255,0.94);

    z-index: 30;
}

#gameOver h1 {

    color: #FFD21F;

    font-size: 48px;

    font-weight: 900;

    text-shadow:
        2px 2px 0 #111;

    margin-bottom: 10px;
}

#finalScore {

    color: #FFD21F;

    font-size: 24px;

    font-weight: bold;

    text-shadow:
        1px 1px 0 #111;

    margin-bottom: 25px;
}

#restartButton {

    padding: 14px 32px;

    border: 3px solid #111;

    border-radius: 14px;

    background: #FFD21F;

    color: #111;

    font-size: 18px;

    font-weight: 900;

    box-shadow:
        4px 4px 0 #111;
}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="ui">

    <div id="score">0</div>

    <div id="message">
        화면을 터치해서 블록을 놓으세요
    </div>

</div>


<div id="gameOver">

    <h1>GAME OVER</h1>

    <div id="finalScore">
        점수: 0
    </div>

    <button id="restartButton">
        다시 하기
    </button>

</div>


<script>


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let width = 0;

let height = 0;

let pixelRatio = 1;


function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    pixelRatio =
        window.devicePixelRatio || 1;


    canvas.width =
        width * pixelRatio;

    canvas.height =
        height * pixelRatio;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();



// =====================================================
// 이미지
// =====================================================

const images = [];


// image1.png
// image2.png
// image3.png

for (
    let i = 1;
    i <= 3;
    i++
) {

    const img =
        new Image();

    img.src =
        "images/image" +
        i +
        ".png";

    images.push(img);
}



// =====================================================
// 이미지 로딩 확인
// =====================================================

images.forEach(
    (img, index) => {

        img.onload = function() {

            console.log(
                "이미지 로딩 성공:",
                "image" +
                (index + 1) +
                ".png"
            );
        };


        img.onerror = function() {

            console.error(
                "이미지 로딩 실패:",
                "images/image" +
                (index + 1) +
                ".png"
            );
        };

    }
);



// =====================================================
// 게임 설정
// =====================================================

const BLOCK_HEIGHT = 65;

const START_WIDTH = 280;

const BOTTOM_MARGIN = 150;

const YELLOW = "#FFD21F";



// =====================================================
// 게임 변수
// =====================================================

let blocks = [];

let currentBlock = null;

let score = 0;

let speed = 3;

let direction = 1;

let cameraY = 0;

let gameRunning = false;

let lastTime = 0;

let lastImageIndex = -1;



// =====================================================
// 랜덤 이미지
// =====================================================

function getRandomImage() {

    let index;


    do {

        index =
            Math.floor(
                Math.random() *
                images.length
            );

    }

    while (
        index === lastImageIndex &&
        images.length > 1
    );


    lastImageIndex =
        index;


    return images[index];
}



// =====================================================
// 배경
// =====================================================

function drawBackground() {

    // 흰색

    ctx.fillStyle =
        "#FFFFFF";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // -----------------------------------------
    // 노란색 땡땡이
    // -----------------------------------------

    ctx.save();

    ctx.fillStyle =
        YELLOW;

    ctx.globalAlpha =
        0.16;


    const spacing = 42;


    for (
        let y = 20;
        y < height;
        y += spacing
    ) {

        for (
            let x = 20;
            x < width;
            x += spacing
        ) {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    ctx.restore();



    // -----------------------------------------
    // 노란색 빗금
    // -----------------------------------------

    ctx.save();

    ctx.strokeStyle =
        YELLOW;

    ctx.globalAlpha =
        0.09;

    ctx.lineWidth = 2;


    for (
        let x = -height;
        x < width + height;
        x += 65
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            height
        );

        ctx.lineTo(
            x + height,
            0
        );

        ctx.stroke();
    }


    ctx.restore();
}



// =====================================================
// 블록 생성
// =====================================================

function createBlock() {

    const previous =
        blocks[
            blocks.length - 1
        ];


    let blockWidth;


    if (previous) {

        blockWidth =
            previous.width;

    } else {

        blockWidth =
            Math.min(
                START_WIDTH,
                width * 0.72
            );
    }


    let x;


    if (previous) {

        x =
            previous.x;

    } else {

        x =
            (
                width -
                blockWidth
            ) / 2;
    }


    return {

        x: x,

        y:
            height -
            BOTTOM_MARGIN -
            (
                blocks.length *
                BLOCK_HEIGHT
            ),

        width:
            blockWidth,

        height:
            BLOCK_HEIGHT,

        image:
            getRandomImage()
    };
}



// =====================================================
// 게임 시작
// =====================================================

function startGame() {

    blocks = [];

    score = 0;

    speed = 3;

    direction = 1;

    cameraY = 0;

    gameRunning = true;

    lastImageIndex = -1;


    document
        .getElementById("gameOver")
        .style.display =
        "none";


    // -----------------------------------------
    // 바닥 블록
    // -----------------------------------------

    const baseWidth =
        Math.min(
            START_WIDTH,
            width * 0.72
        );


    blocks.push({

        x:
            (
                width -
                baseWidth
            ) / 2,

        y:
            height -
            BOTTOM_MARGIN,

        width:
            baseWidth,

        height:
            BLOCK_HEIGHT,

        image:
            getRandomImage()
    });


    // -----------------------------------------
    // 움직이는 블록
    // -----------------------------------------

    currentBlock =
        createBlock();


    // 화면 왼쪽에서 시작

    currentBlock.x =
        0;


    direction = 1;


    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("message")
        .textContent =
        "화면을 터치해서 블록을 놓으세요";


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );
}



// =====================================================
// 블록 놓기
// =====================================================

function dropBlock() {

    if (!gameRunning)
        return;


    const previous =
        blocks[
            blocks.length - 1
        ];


    // -----------------------------------------
    // 겹치는 영역
    // -----------------------------------------

    const left =
        Math.max(
            currentBlock.x,
            previous.x
        );


    const right =
        Math.min(

            currentBlock.x +
            currentBlock.width,

            previous.x +
            previous.width
        );


    const overlap =
        right - left;


    // -----------------------------------------
    // 완전히 빗나감
    // -----------------------------------------

    if (overlap <= 0) {

        endGame();

        return;
    }


    // -----------------------------------------
    // 겹친 부분만 남김
    // -----------------------------------------

    currentBlock.x =
        left;

    currentBlock.width =
        overlap;


    // 탑에 추가

    blocks.push(
        currentBlock
    );


    score++;


    document
        .getElementById("score")
        .textContent =
        score;


    // -----------------------------------------
    // 속도 증가
    // -----------------------------------------

    speed += 0.12;


    // -----------------------------------------
    // 새 블록
    // -----------------------------------------

    currentBlock =
        createBlock();


    // 랜덤 방향

    direction =
        Math.random() < 0.5
            ? -1
            : 1;


    // 화면 밖에서 등장

    if (direction === 1) {

        currentBlock.x =
            -currentBlock.width;

    } else {

        currentBlock.x =
            width;
    }
}



// =====================================================
// 게임 오버
// =====================================================

function endGame() {

    gameRunning =
        false;


    document
        .getElementById("finalScore")
        .textContent =
        "점수: " +
        score;


    document
        .getElementById("gameOver")
        .style.display =
        "flex";
}



// =====================================================
// 블록 그리기
// =====================================================

function drawBlock(block) {

    const y =
        block.y +
        cameraY;


    // -----------------------------------------
    // 노란색 테두리
    // -----------------------------------------

    ctx.fillStyle =
        "#111";


    ctx.fillRect(

        block.x - 2,
        y - 2,

        block.width + 4,
        block.height + 4
    );


    // -----------------------------------------
    // 노란색 배경
    // -----------------------------------------

    ctx.fillStyle =
        YELLOW;


    ctx.fillRect(

        block.x,
        y,

        block.width,
        block.height
    );


    const image =
        block.image;


    // -----------------------------------------
    // 이미지가 로딩됐으면 그리기
    // -----------------------------------------

    if (
        image &&
        image.complete &&
        image.naturalWidth > 0
    ) {

        /*
         * 이미지를 블록 영역 안에
         * 꽉 차도록 그린다.
         */

        ctx.save();


        // 블록 영역 밖으로
        // 이미지가 나오지 않도록 제한

        ctx.beginPath();

        ctx.rect(

            block.x,
            y,

            block.width,
            block.height
        );

        ctx.clip();


        // 이미지 비율

        const imageRatio =
            image.naturalWidth /
            image.naturalHeight;


        const blockRatio =
            block.width /
            block.height;


        let drawWidth;

        let drawHeight;

        let drawX;

        let drawY;


        // 이미지가 블록보다 가로로 넓은 경우

        if (
            imageRatio >
            blockRatio
        ) {

            drawHeight =
                block.height;

            drawWidth =
                drawHeight *
                imageRatio;

        }

        // 이미지가 블록보다 세로로 긴 경우

        else {

            drawWidth =
                block.width;

            drawHeight =
                drawWidth /
                imageRatio;
        }


        // 가운데 정렬

        drawX =
            block.x +
            (
                block.width -
                drawWidth
            ) / 2;


        drawY =
            y +
            (
                block.height -
                drawHeight
            ) / 2;


        ctx.drawImage(

            image,

            drawX,
            drawY,

            drawWidth,
            drawHeight
        );


        ctx.restore();
    }


    // -----------------------------------------
    // 블록 위쪽 하이라이트
    // -----------------------------------------

    ctx.fillStyle =
        "rgba(255,255,255,0.25)";


    ctx.fillRect(

        block.x,
        y,

        block.width,
        4
    );
}



// =====================================================
// 화면 그리기
// =====================================================

function draw() {

    drawBackground();


    // -----------------------------------------
    // 쌓인 블록
    // -----------------------------------------

    for (
        const block of blocks
    ) {

        drawBlock(
            block
        );
    }


    // -----------------------------------------
    // 현재 움직이는 블록
    // -----------------------------------------

    if (
        gameRunning &&
        currentBlock
    ) {

        drawBlock(
            currentBlock
        );
    }
}



// =====================================================
// 게임 업데이트
// =====================================================

function update(delta) {

    if (!gameRunning)
        return;


    // -----------------------------------------
    // 움직이는 블록
    // -----------------------------------------

    currentBlock.x +=
        direction *
        speed *
        delta;


    // -----------------------------------------
    // 오른쪽 벽
    // -----------------------------------------

    if (
        currentBlock.x +
        currentBlock.width >=
        width
    ) {

        currentBlock.x =
            width -
            currentBlock.width;

        direction =
            -1;
    }


    // -----------------------------------------
    // 왼쪽 벽
    // -----------------------------------------

    if (
        currentBlock.x <= 0
    ) {

        currentBlock.x =
            0;

        direction =
            1;
    }


    // -----------------------------------------
    // 카메라
    // -----------------------------------------

    if (currentBlock) {

        const targetCamera =
            Math.max(

                0,

                height * 0.38 -
                currentBlock.y
            );


        cameraY +=
            (
                targetCamera -
                cameraY
            ) * 0.08;
    }
}



// =====================================================
// 게임 루프
// =====================================================

function gameLoop(time) {

    const delta =
        Math.min(

            (
                time -
                lastTime
            ) / 16.67,

            2
        );


    lastTime =
        time;


    update(delta);

    draw();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );
    }
}



// =====================================================
// 터치 / 클릭
// =====================================================

canvas.addEventListener(

    "pointerdown",

    function(event) {

        event.preventDefault();

        dropBlock();
    }
);



// =====================================================
// 키보드
// =====================================================

document.addEventListener(

    "keydown",

    function(event) {

        if (

            event.code === "Space" ||
            event.code === "Enter"

        ) {

            dropBlock();
        }
    }
);



// =====================================================
// 다시 하기
// =====================================================

document
    .getElementById("restartButton")
    .addEventListener(

        "click",

        function() {

            startGame();
        }
    );



// =====================================================
// 시작
// =====================================================

startGame();


</script>

</body>

</html>

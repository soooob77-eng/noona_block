<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Random Stack Game</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111827;

    touch-action: none;

    user-select: none;
}

canvas {

    display: block;

    width: 100vw;
    height: 100vh;
}


/* -----------------------------
   점수 UI
----------------------------- */

#ui {

    position: fixed;

    top: 25px;
    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    pointer-events: none;

    z-index: 10;
}


#score {

    font-size: 44px;

    font-weight: bold;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.5);
}


#message {

    margin-top: 5px;

    font-size: 15px;

    opacity: 0.85;
}


/* -----------------------------
   게임 오버
----------------------------- */

#gameOver {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        rgba(0,0,0,0.72);

    color: white;

    text-align: center;

    z-index: 20;
}


#gameOver h1 {

    font-size: 48px;

    margin-bottom: 10px;
}


#finalScore {

    font-size: 24px;

    margin-bottom: 25px;
}


#restartButton {

    border: none;

    padding: 14px 32px;

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;

    background: white;

    color: #111827;

    cursor: pointer;
}


#restartButton:active {

    transform: scale(0.95);
}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="ui">

    <div id="score">
        0
    </div>

    <div id="message">
        화면을 터치해서 블록을 놓으세요
    </div>

</div>


<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <div id="finalScore">
        점수: 0
    </div>

    <button id="restartButton">
        다시 하기
    </button>

</div>



<script>


// =====================================================
// Canvas 설정
// =====================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let pixelRatio;


function resizeCanvas() {

    pixelRatio =
        window.devicePixelRatio || 1;

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * pixelRatio;

    canvas.height =
        height * pixelRatio;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();



// =====================================================
// 이미지 10개 불러오기
// =====================================================

const images = [];


for (
    let i = 1;
    i <= 10;
    i++
) {

    const image =
        new Image();

    image.src =
        "images/image" +
        i +
        ".jpg";

    images.push(image);
}



// =====================================================
// 게임 설정
// =====================================================

const BLOCK_HEIGHT = 55;

const START_WIDTH = 280;

const START_Y_OFFSET = 130;



// =====================================================
// 게임 변수
// =====================================================

let blocks = [];

let currentBlock = null;

let score = 0;

let speed = 3;

let direction = 1;

let cameraY = 0;

let gameRunning = false;

let lastTime = 0;


// ⭐ 직전에 사용한 이미지 번호

let lastImageIndex = -1;



// =====================================================
// 랜덤 이미지 선택
// =====================================================

function getRandomImage() {

    let randomIndex;


    // 직전 이미지와 다른 이미지가 나올 때까지
    // 랜덤으로 번호를 뽑는다

    do {

        randomIndex =
            Math.floor(
                Math.random() *
                images.length
            );

    } while (
        randomIndex === lastImageIndex
        &&
        images.length > 1
    );


    // 이번 이미지 번호 저장

    lastImageIndex =
        randomIndex;


    return images[randomIndex];
}



// =====================================================
// 블록 생성
// =====================================================

function createBlock() {

    const previous =
        blocks[blocks.length - 1];


    let blockWidth;


    // 이전 블록의 너비를 따라간다

    if (previous) {

        blockWidth =
            previous.width;

    } else {

        blockWidth =
            Math.min(
                START_WIDTH,
                width * 0.7
            );
    }


    let x;


    if (previous) {

        x =
            previous.x;

    } else {

        x =
            (width - blockWidth) / 2;
    }


    return {

        x: x,

        y:
            height -
            START_Y_OFFSET -
            blocks.length *
            BLOCK_HEIGHT,

        width:
            blockWidth,

        height:
            BLOCK_HEIGHT,

        // ⭐ 랜덤 이미지

        image:
            getRandomImage()
    };
}



// =====================================================
// 게임 시작
// =====================================================

function startGame() {

    blocks = [];

    score = 0;

    speed = 3;

    direction = 1;

    cameraY = 0;

    gameRunning = true;


    // 랜덤 이미지 기록 초기화

    lastImageIndex = -1;


    document
        .getElementById("gameOver")
        .style.display =
        "none";


    // -----------------------------------------
    // 바닥 블록
    // -----------------------------------------

    const baseWidth =
        Math.min(
            START_WIDTH,
            width * 0.7
        );


    blocks.push({

        x:
            (width - baseWidth) / 2,

        y:
            height -
            START_Y_OFFSET,

        width:
            baseWidth,

        height:
            BLOCK_HEIGHT,

        image:
            getRandomImage()
    });


    // -----------------------------------------
    // 첫 번째 움직이는 블록
    // -----------------------------------------

    currentBlock =
        createBlock();


    currentBlock.x =
        0;


    direction = 1;


    // 점수 초기화

    document
        .getElementById("score")
        .textContent =
        score;


    document
        .getElementById("message")
        .textContent =
        "화면을 터치해서 블록을 놓으세요";


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );
}



// =====================================================
// 블록 놓기
// =====================================================

function dropBlock() {

    if (!gameRunning)
        return;


    const previous =
        blocks[
            blocks.length - 1
        ];


    // -----------------------------------------
    // 겹치는 영역 계산
    // -----------------------------------------

    const left =
        Math.max(
            currentBlock.x,
            previous.x
        );


    const right =
        Math.min(

            currentBlock.x +
            currentBlock.width,

            previous.x +
            previous.width
        );


    const overlap =
        right - left;



    // -----------------------------------------
    // 겹치는 부분이 없으면 게임 오버
    // -----------------------------------------

    if (overlap <= 0) {

        endGame();

        return;
    }



    // -----------------------------------------
    // 겹치는 부분만 남긴다
    // -----------------------------------------

    currentBlock.x =
        left;

    currentBlock.width =
        overlap;



    // -----------------------------------------
    // 블록 추가
    // -----------------------------------------

    blocks.push(
        currentBlock
    );


    score++;


    document
        .getElementById("score")
        .textContent =
        score;



    // -----------------------------------------
    // 점점 빨라짐
    // -----------------------------------------

    speed += 0.12;



    // -----------------------------------------
    // 새로운 블록
    // -----------------------------------------

    currentBlock =
        createBlock();



    // -----------------------------------------
    // 랜덤 방향
    // -----------------------------------------

    direction =
        Math.random() > 0.5
            ? 1
            : -1;



    // -----------------------------------------
    // 화면 바깥에서 등장
    // -----------------------------------------

    if (direction === 1) {

        currentBlock.x =
            -currentBlock.width;

    } else {

        currentBlock.x =
            width;
    }
}



// =====================================================
// 게임 오버
// =====================================================

function endGame() {

    gameRunning =
        false;


    document
        .getElementById("finalScore")
        .textContent =
        "점수: " + score;


    document
        .getElementById("gameOver")
        .style.display =
        "flex";
}



// =====================================================
// 이미지 블록 그리기
// =====================================================

function drawBlock(block) {

    const drawY =
        block.y +
        cameraY;


    const image =
        block.image;



    // 이미지가 아직 로딩되지 않았을 경우

    if (!image.complete) {

        ctx.fillStyle =
            "#777";

        ctx.fillRect(

            block.x,
            drawY,

            block.width,
            block.height
        );

        return;
    }



    // -----------------------------------------
    // 이미지 비율 계산
    // -----------------------------------------

    const imageRatio =
        image.width /
        image.height;


    const targetRatio =
        block.width /
        block.height;



    let sourceX = 0;

    let sourceY = 0;

    let sourceWidth =
        image.width;

    let sourceHeight =
        image.height;



    // -----------------------------------------
    // 이미지 중앙 부분 자르기
    // -----------------------------------------

    if (
        imageRatio >
        targetRatio
    ) {

        sourceWidth =
            image.height *
            targetRatio;

        sourceX =
            (
                image.width -
                sourceWidth
            ) / 2;

    } else {

        sourceHeight =
            image.width /
            targetRatio;

        sourceY =
            (
                image.height -
                sourceHeight
            ) / 2;
    }



    // -----------------------------------------
    // 이미지 그리기
    // -----------------------------------------

    ctx.drawImage(

        image,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        block.x,
        drawY,

        block.width,
        block.height
    );



    // -----------------------------------------
    // 위쪽 하이라이트
    // -----------------------------------------

    ctx.fillStyle =
        "rgba(255,255,255,0.12)";


    ctx.fillRect(

        block.x,
        drawY,

        block.width,
        5
    );
}



// =====================================================
// 화면 그리기
// =====================================================

function draw() {

    // -----------------------------------------
    // 배경
    // -----------------------------------------

    const gradient =
        ctx.createLinearGradient(

            0,
            0,

            0,
            height
        );


    gradient.addColorStop(
        0,
        "#111827"
    );


    gradient.addColorStop(
        1,
        "#312e81"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        0,

        width,
        height
    );



    // -----------------------------------------
    // 쌓인 블록
    // -----------------------------------------

    for (
        const block of blocks
    ) {

        drawBlock(
            block
        );
    }



    // -----------------------------------------
    // 움직이는 블록
    // -----------------------------------------

    if (
        gameRunning &&
        currentBlock
    ) {

        drawBlock(
            currentBlock
        );
    }
}



// =====================================================
// 게임 업데이트
// =====================================================

function update(delta) {

    if (!gameRunning)
        return;


    // -----------------------------------------
    // 블록 이동
    // -----------------------------------------

    currentBlock.x +=
        direction *
        speed *
        delta;



    // -----------------------------------------
    // 오른쪽 벽
    // -----------------------------------------

    if (
        currentBlock.x +
        currentBlock.width >=
        width
    ) {

        currentBlock.x =
            width -
            currentBlock.width;

        direction = -1;
    }



    // -----------------------------------------
    // 왼쪽 벽
    // -----------------------------------------

    if (
        currentBlock.x <= 0
    ) {

        currentBlock.x = 0;

        direction = 1;
    }



    // -----------------------------------------
    // 카메라 이동
    // -----------------------------------------

    const targetCamera =
        Math.max(

            0,

            height * 0.4 -
            currentBlock.y
        );


    cameraY +=
        (
            targetCamera -
            cameraY
        ) * 0.08;
}



// =====================================================
// 게임 루프
// =====================================================

function gameLoop(time) {

    const delta =
        Math.min(

            (time - lastTime) /
            16.67,

            2
        );


    lastTime =
        time;


    update(delta);

    draw();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );
    }
}



// =====================================================
// 모바일 터치
// =====================================================

canvas.addEventListener(

    "pointerdown",

    function(event) {

        event.preventDefault();

        dropBlock();
    }
);



// =====================================================
// PC 키보드
// =====================================================

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.code === "Space" ||
            event.code === "Enter"
        ) {

            dropBlock();
        }
    }
);



// =====================================================
// 다시 하기 버튼
// =====================================================

document
    .getElementById("restartButton")
    .addEventListener(

        "click",

        function() {

            startGame();
        }
    );



// =====================================================
// 게임 시작
// =====================================================

startGame();


</script>

</body>

</html>

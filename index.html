<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Yellow Stack</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    touch-action: none;

    user-select: none;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}

canvas {

    display: block;

    width: 100vw;
    height: 100vh;
}


/* =================================================
   점수
================================================= */

#ui {

    position: fixed;

    top: 24px;
    left: 0;

    width: 100%;

    text-align: center;

    pointer-events: none;

    z-index: 10;
}

#score {

    color: #FFD21F;

    font-size: 46px;

    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:
        2px 2px 0px #111;
}

#message {

    margin-top: 6px;

    color: #FFD21F;

    font-size: 15px;

    font-weight: bold;

    text-shadow:
        1px 1px 0px #111;
}


/* =================================================
   게임 오버
================================================= */

#gameOver {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        rgba(255,255,255,0.92);

    z-index: 20;

    text-align: center;
}

#gameOver h1 {

    color: #FFD21F;

    font-size: 48px;

    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:
        2px 2px 0px #111;

    margin-bottom: 10px;
}

#finalScore {

    color: #FFD21F;

    font-size: 24px;

    font-weight: bold;

    text-shadow:
        1px 1px 0px #111;

    margin-bottom: 25px;
}

#restartButton {

    border: 3px solid #111;

    border-radius: 14px;

    padding: 14px 34px;

    background: #FFD21F;

    color: #111;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        4px 4px 0px #111;
}

#restartButton:active {

    transform:
        translate(3px, 3px);

    box-shadow:
        1px 1px 0px #111;
}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="ui">

    <div id="score">
        0
    </div>

    <div id="message">
        화면을 터치해서 블록을 놓으세요
    </div>

</div>


<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <div id="finalScore">
        점수: 0
    </div>

    <button id="restartButton">
        다시 하기
    </button>

</div>


<script>


// =====================================================
// Canvas
// =====================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let pixelRatio;


function resizeCanvas() {

    pixelRatio =
        window.devicePixelRatio || 1;

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * pixelRatio;

    canvas.height =
        height * pixelRatio;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(

        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();



// =====================================================
// 이미지 3개
// =====================================================

const images = [];


for (let i = 1; i <= 3; i++) {

    const img =
        new Image();

    // ⭐ 소문자 파일명 적용
    // image1.png
    // image2.png
    // image3.png

    img.src =
        "images/image" +
        i +
        ".png";

    images.push(img);
}



// =====================================================
// 게임 설정
// =====================================================

const BLOCK_HEIGHT = 55;

const START_WIDTH = 280;

const START_Y_OFFSET = 130;

const YELLOW = "#FFD21F";



// =====================================================
// 게임 변수
// =====================================================

let blocks = [];

let currentBlock = null;

let score = 0;

let speed = 3;

let direction = 1;

let cameraY = 0;

let gameRunning = false;

let lastTime = 0;


// 직전에 사용한 이미지

let lastImageIndex = -1;



// =====================================================
// 랜덤 이미지
// =====================================================

function getRandomImage() {

    let randomIndex;


    do {

        randomIndex =
            Math.floor(
                Math.random() *
                images.length
            );

    }

    while (

        randomIndex ===
        lastImageIndex

        &&
        images.length > 1
    );


    lastImageIndex =
        randomIndex;


    return images[
        randomIndex
    ];
}



// =====================================================
// 배경
// =====================================================

function drawBackground() {

    // 흰색 배경

    ctx.fillStyle =
        "#FFFFFF";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // -----------------------------------------
    // 노란색 땡땡이
    // -----------------------------------------

    ctx.save();

    ctx.globalAlpha =
        0.18;

    ctx.fillStyle =
        YELLOW;


    const dotSpacing = 42;

    const dotRadius = 3;


    for (
        let y = 20;
        y < height;
        y += dotSpacing
    ) {

        for (
            let x = 20;
            x < width;
            x += dotSpacing
        ) {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                dotRadius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    ctx.restore();



    // -----------------------------------------
    // 노란색 빗금
    // -----------------------------------------

    ctx.save();

    ctx.globalAlpha =
        0.10;

    ctx.strokeStyle =
        YELLOW;

    ctx.lineWidth =
        2;


    const stripeSize = 70;


    for (
        let x = -height;
        x < width + height;
        x += stripeSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            height
        );

        ctx.lineTo(
            x + height,
            0
        );

        ctx.stroke();
    }


    ctx.restore();



    // -----------------------------------------
    // 중앙 영역
    // -----------------------------------------

    ctx.save();


    const centerGradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    centerGradient.addColorStop(
        0,
        "rgba(255,255,255,0.82)"
    );


    centerGradient.addColorStop(
        0.5,
        "rgba(255,255,255,0.45)"
    );


    centerGradient.addColorStop(
        1,
        "rgba(255,255,255,0.82)"
    );


    ctx.fillStyle =
        centerGradient;


    ctx.fillRect(
        width * 0.10,
        0,
        width * 0.80,
        height
    );


    ctx.restore();
}



// =====================================================
// 블록 생성
// =====================================================

function createBlock() {

    const previous =
        blocks[
            blocks.length - 1
        ];


    let blockWidth;


    if (previous) {

        blockWidth =
            previous.width;

    } else {

        blockWidth =
            Math.min(
                START_WIDTH,
                width * 0.70
            );
    }


    let x;


    if (previous) {

        x =
            previous.x;

    } else {

        x =
            (
                width -
                blockWidth
            ) / 2;
    }


    return {

        x: x,

        y:
            height -
            START_Y_OFFSET -
            blocks.length *
            BLOCK_HEIGHT,

        width:
            blockWidth,

        height:
            BLOCK_HEIGHT,

        image:
            getRandomImage()
    };
}



// =====================================================
// 게임 시작
// =====================================================

function startGame() {

    blocks = [];

    score = 0;

    speed = 3;

    direction = 1;

    cameraY = 0;

    gameRunning = true;


    lastImageIndex = -1;


    document
        .getElementById("gameOver")
        .style.display =
        "none";


    const baseWidth =
        Math.min(
            START_WIDTH,
            width * 0.70
        );


    blocks.push({

        x:
            (
                width -
                baseWidth
            ) / 2,

        y:
            height -
            START_Y_OFFSET,

        width:
            baseWidth,

        height:
            BLOCK_HEIGHT,

        image:
            getRandomImage()
    });


    currentBlock =
        createBlock();


    currentBlock.x =
        0;


    direction = 1;


    document
        .getElementById("score")
        .textContent =
        score;


    document
        .getElementById("message")
        .textContent =
        "화면을 터치해서 블록을 놓으세요";


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );
}



// =====================================================
// 블록 놓기
// =====================================================

function dropBlock() {

    if (!gameRunning)
        return;


    const previous =
        blocks[
            blocks.length - 1
        ];


    const left =
        Math.max(
            currentBlock.x,
            previous.x
        );


    const right =
        Math.min(

            currentBlock.x +
            currentBlock.width,

            previous.x +
            previous.width
        );


    const overlap =
        right - left;


    if (overlap <= 0) {

        endGame();

        return;
    }


    currentBlock.x =
        left;

    currentBlock.width =
        overlap;


    blocks.push(
        currentBlock
    );


    score++;


    document
        .getElementById("score")
        .textContent =
        score;


    // 난이도 상승

    speed += 0.12;


    // 다음 블록

    currentBlock =
        createBlock();


    // 방향 랜덤

    direction =
        Math.random() > 0.5
            ? 1
            : -1;


    // 화면 밖에서 등장

    if (direction === 1) {

        currentBlock.x =
            -currentBlock.width;

    } else {

        currentBlock.x =
            width;
    }
}



// =====================================================
// 게임 오버
// =====================================================

function endGame() {

    gameRunning =
        false;


    document
        .getElementById("finalScore")
        .textContent =
        "점수: " + score;


    document
        .getElementById("gameOver")
        .style.display =
        "flex";
}



// =====================================================
// 이미지 블록 그리기
// =====================================================

function drawBlock(block) {

    const drawY =
        block.y +
        cameraY;


    const image =
        block.image;


    if (!image.complete) {

        ctx.fillStyle =
            YELLOW;

        ctx.fillRect(

            block.x,
            drawY,

            block.width,
            block.height
        );

        return;
    }


    const imageRatio =
        image.width /
        image.height;


    const blockRatio =
        block.width /
        block.height;


    let sourceX = 0;

    let sourceY = 0;

    let sourceWidth =
        image.width;

    let sourceHeight =
        image.height;


    // 이미지 중앙을 잘라냄

    if (
        imageRatio >
        blockRatio
    ) {

        sourceWidth =
            image.height *
            blockRatio;

        sourceX =
            (
                image.width -
                sourceWidth
            ) / 2;

    }

    else {

        sourceHeight =
            image.width /
            blockRatio;

        sourceY =
            (
                image.height -
                sourceHeight
            ) / 2;
    }


    // 이미지 출력

    ctx.drawImage(

        image,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        block.x,
        drawY,

        block.width,
        block.height
    );


    // 노란색 라인

    ctx.fillStyle =
        "rgba(255,210,31,0.30)";


    ctx.fillRect(

        block.x,
        drawY,

        block.width,
        4
    );
}



// =====================================================
// 화면 그리기
// =====================================================

function draw() {

    drawBackground();


    // 쌓인 블록

    for (
        const block of blocks
    ) {

        drawBlock(
            block
        );
    }


    // 움직이는 블록

    if (
        gameRunning &&
        currentBlock
    ) {

        drawBlock(
            currentBlock
        );
    }
}



// =====================================================
// 게임 업데이트
// =====================================================

function update(delta) {

    if (!gameRunning)
        return;


    currentBlock.x +=
        direction *
        speed *
        delta;


    // 오른쪽 벽

    if (
        currentBlock.x +
        currentBlock.width >=
        width
    ) {

        currentBlock.x =
            width -
            currentBlock.width;

        direction =
            -1;
    }


    // 왼쪽 벽

    if (
        currentBlock.x <= 0
    ) {

        currentBlock.x =
            0;

        direction =
            1;
    }


    // 카메라

    const targetCamera =
        Math.max(

            0,

            height * 0.40 -
            currentBlock.y
        );


    cameraY +=
        (
            targetCamera -
            cameraY
        ) * 0.08;
}



// =====================================================
// 게임 루프
// =====================================================

function gameLoop(time) {

    const delta =
        Math.min(

            (
                time -
                lastTime
            ) / 16.67,

            2
        );


    lastTime =
        time;


    update(delta);

    draw();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );
    }
}



// =====================================================
// 터치 / 마우스
// =====================================================

canvas.addEventListener(

    "pointerdown",

    function(event) {

        event.preventDefault();

        dropBlock();
    }
);



// =====================================================
// 키보드
// =====================================================

document.addEventListener(

    "keydown",

    function(event) {

        if (

            event.code === "Space" ||

            event.code === "Enter"

        ) {

            dropBlock();
        }
    }
);



// =====================================================
// 다시 하기
// =====================================================

document
    .getElementById("restartButton")
    .addEventListener(

        "click",

        function() {

            startGame();
        }
    );



// =====================================================
// 게임 시작
// =====================================================

startGame();

</script>

</body>

</html>
